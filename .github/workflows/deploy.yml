# The one workflow this project has, and what it gates is the URL.
#
# 0011 §2 fixes the order, and that order is the reason a workflow was chosen
# over publishing from a branch: the four checks 0009 §8 names run first, `tsc`
# emits, and `actions/deploy-pages` runs only if everything before it passed. A
# red check produces no deployment rather than a deployed page with a warning
# beside it.
#
# **This is not continuous integration and does not become it** (0011 §2).
# Nothing here gates a merge — what gates a merge is review, and these steps run
# after one.
#
# **Pages is configured by a person, not by this file.** `actions/configure-
# pages` would enable it on the first run, which is a repository setting and a
# publishing decision at once, and CLAUDE.md makes both a stop-and-ask. Without
# it the last step fails until somebody has set the publishing source to GitHub
# Actions, which is the failure worth having.

name: deploy

on:
  push:
    branches: [main]

# What `actions/deploy-pages` documents as needed, and nothing beyond it.
# `contents: read` because two repositories are read and neither is written.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one is not canceled: the artifact a
# run publishes is the tree it checked out, so canceling the older of two
# would silently decide which commit is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # 0011 §2 adopts GitHub's recommended protection rule for this environment,
    # restricting it to the default branch — without it any branch could deploy
    # and §6's gate would be one workflow file away from being bypassed. Naming
    # the environment here is the half a file can carry; the rule itself is a
    # repository setting.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Two checkouts side by side, because `check:method` invokes a script from
      # a sibling clone — the `../agent-project-rules` CLAUDE.md tells a person
      # to create. `path` is documented as relative to the workspace and cannot
      # leave it, so the trunk goes into a subdirectory of its own and the
      # sibling beside it, which reproduces that layout exactly.
      - name: The project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dot-panic

      # Pinned to a release rather than to `main`, because this is another
      # repository deciding whether this one deploys. `v0.5.3` is the newest
      # release carrying catalog 0.5, which is the version `method.json`
      # declares — the two move together or the check is deciding against a
      # catalog this project has not adopted.
      - name: The method it is checked against
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nanatsusaya/agent-project-rules
          ref: v0.5.3
          path: agent-project-rules

      # 0009 §7's runtime, pinned to the version the lockfile was written by.
      # Node is not installed here: the runner image already carries one, and
      # the only thing that needs it is the method check's `.mjs` script.
      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: The three development dependencies
        run: bun install --frozen-lockfile
        working-directory: dot-panic

      # 0009 §8's four, one step each and in that order. Not `bun run check`:
      # the aggregate stops at the first failure and carries its exit status,
      # which is right for a person and wrong here, because the step that failed
      # is the finding. CLAUDE.md's *Commands* is the authority for what each
      # decides and what its failure means.
      - name: Does the documentation still describe the project
        run: bun run check:method
        working-directory: dot-panic

      - name: Does the source type-check
        run: bun run check:types
        working-directory: dot-panic

      - name: Format and lint
        run: bun run check:lint
        working-directory: dot-panic

      - name: Tests, and the coverage floor
        run: bun run check:test
        working-directory: dot-panic

      # 0009 §3: `tsc` emits one `.js` beside each `.ts`, and no bundler runs.
      # This is the first time in the whole pipeline that any output exists —
      # 0009 R1 keeps it out of the repository, which is what makes watching the
      # built page the only evidence it matches what the tests passed (0010 §9).
      - name: Emit
        run: bunx tsc
        working-directory: dot-panic

      # What the page loads, and nothing else. The artifact is deliberately not
      # the repository: 0011 §6 says its check runs against the artifact rather
      # than the source tree *because the source is supposed to carry the
      # placeholder*, and a tree containing `docs/` would fail that check for
      # ever on 0004 §3's stand-in. So the site is the two root files and the
      # emitted JavaScript of 0002 §7's three parts.
      #
      # `*.test.js` is excluded rather than filtered afterwards: 0010 §4 puts
      # the Core's tests beside its source, so `core/*.js` is test code too, and
      # a copy that took all of it would publish the suite.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          find core shell view -name '*.js' ! -name '*.test.js' -exec cp --parents {} _site/ \;
        working-directory: dot-panic

      # 0011 §6, and it is the first of this project's remembered rules to
      # become a command. It fails the deployment while the artifact still
      # carries 0004 §3's placeholder, which is what makes a real address a
      # precondition of publishing rather than of committing — #90 is the ticket
      # that supplies one, and until it lands this step is expected to fail.
      #
      # What no command decides is an address that is real and wrong.
      - name: The imprint carries no placeholder
        run: |
          if grep -rl 'Musterstadt' _site; then
            echo '0011 §6: the built artifact still carries the placeholder address. #90 supplies a real one.'
            exit 1
          fi
        working-directory: dot-panic

      - name: Upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dot-panic/_site

      # Last, and reached only because every step above passed — which is the
      # whole of 0011 §2 expressed as a step order rather than as a condition.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
